; PlatformIO Project Configuration File
; Dual-Axis Arduino Solar Tracker - ENGR 102B, University of Arizona
;
; Source code lives in src/main.cpp.
; The Arduino IDE version lives in arduino/SolarTracker/ and is ignored here.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    arduino-libraries/Servo@^1.2.2
